[package]
name = "music-studio-desktop"
version = "1.0.0"
description = "Music Studio desktop shell"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
flate2 = "1"
tar = "0.4"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking"] }
sysinfo = "0.37.2"
