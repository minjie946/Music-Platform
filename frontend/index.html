<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Music Studio</title>
</head>

<body>
  <div id="root">
    <style>
      html,
      body,
      #root {
        height: 100%;
      }

      body {
        margin: 0;
        background: #0f1117;
        color: #e5e7eb;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .boot-fallback {
        min-height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
      }

      .boot-card {
        width: min(560px, 100%);
        border: 1px solid #1f2937;
        border-radius: 24px;
        background: rgba(17, 24, 39, 0.72);
        padding: 40px 32px;
        text-align: center;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
      }

      .boot-icon {
        position: relative;
        width: 80px;
        height: 80px;
        margin: 0 auto 20px;
      }

      .boot-ring-base,
      .boot-ring-spin {
        position: absolute;
        inset: 0;
        border-radius: 999px;
        border: 4px solid #1f2937;
      }

      .boot-ring-spin {
        border-color: #6366f1;
        border-right-color: transparent;
        animation: boot-spin 1s linear infinite;
      }

      .boot-icon-core {
        position: absolute;
        inset: 12px;
        border-radius: 999px;
        background: #030712;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }

      .boot-icon-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .boot-title {
        margin: 0;
        font-size: 20px;
        font-weight: 700;
      }

      .boot-subtitle {
        margin: 12px 0 0;
        color: #9ca3af;
        font-size: 14px;
        line-height: 1.7;
      }

      .boot-progress {
        height: 10px;
        overflow: hidden;
        border-radius: 999px;
        background: #1f2937;
      }

      .boot-progress-bar {
        width: 0%;
        height: 100%;
        border-radius: 999px;
        background: #6366f1;
      }

      .boot-note {
        margin-top: 16px;
        color: #6b7280;
        font-size: 12px;
      }

      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }

      .boot-progress-head {
        margin: 0 0 12px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        color: #d1d5db;
        font-size: 14px;
      }

      .boot-percent {
        color: #9ca3af;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }

      .boot-steps {
        margin-top: 24px;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
        color: #6b7280;
        font-size: 12px;
        text-align: left;
      }

      .boot-step {
        display: flex;
        align-items: center;
        gap: 8px;
        border-radius: 10px;
        background: rgba(0, 0, 0, 0.2);
        padding: 8px 12px;
      }

      .boot-step-dot {
        color: #374151;
      }
    </style>
    <div class="boot-fallback">
      <div class="boot-card">
        <div class="boot-icon">
          <div class="boot-ring-base"></div>
          <div class="boot-ring-spin"></div>
          <div class="boot-icon-core">
            <img class="boot-icon-img" src="/src-tauri/icons/icon.png" alt="" />
          </div>
        </div>
        <h1 class="boot-title">音乐工作台正在启动</h1>
        <p class="boot-subtitle">
          正在创建应用窗口
        </p>
        <div class="boot-progress-head">
          <span>初始化桌面窗口</span>
          <span class="boot-percent">0%</span>
        </div>
        <div class="boot-progress">
          <div class="boot-progress-bar"></div>
        </div>
        <div class="boot-steps">
          <div class="boot-step"><span class="boot-step-dot">○</span><span>初始化桌面窗口</span></div>
          <div class="boot-step"><span class="boot-step-dot">○</span><span>准备内置 Python runtime</span></div>
          <div class="boot-step"><span class="boot-step-dot">○</span><span>启动本地后端服务</span></div>
          <div class="boot-step"><span class="boot-step-dot">○</span><span>等待 API 就绪</span></div>
          <div class="boot-step"><span class="boot-step-dot">○</span><span>加载音乐工作台界面</span></div>
        </div>
        <div class="boot-note">已等待 0s。若长时间停留，请查看桌面应用日志。</div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
